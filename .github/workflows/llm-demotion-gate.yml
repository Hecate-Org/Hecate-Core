name: LLM demotion gate

# Manual only. Live evaluations need a separately provisioned runner with enough RAM/disk
# for the selected model. Never attach the production service host as a runner.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model tag for the simple tier
        required: true
        default: qwen3.6:35b-a3b-q4_K_M
      runner:
        description: Dedicated runner label (or configure HECATE_LLM_EVAL_RUNNER)
        required: false
      capability:
        description: Locked capability to gate (or "all")
        required: true
        default: research_synthesize
      fail_under:
        description: Minimum eval score (0-1)
        required: true
        default: "0.85"

permissions:
  contents: read

concurrency:
  group: llm-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configuration:
    name: Evaluation runner configuration
    runs-on: ubuntu-latest
    steps:
      - name: Explain evaluation status
        env:
          RUNNER: ${{ inputs.runner || vars.HECATE_LLM_EVAL_RUNNER }}
        run: |
          if [ -z "$RUNNER" ]; then
            echo "::notice::Model NOT EVALUATED: no suitable evaluation runner configured. Use scripts/eval_local_model.py on the local GPU."
            echo "Model **NOT EVALUATED**. No runner configured; quality job skipped and no demotion approved. Use the local evaluation script or configure a dedicated evaluation runner." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Live evaluation requested; consult the quality job for its result." >> "$GITHUB_STEP_SUMMARY"
          fi

  demotion-gate:
    name: Eval simple tier + write demotion gate
    if: ${{ inputs.runner != '' || vars.HECATE_LLM_EVAL_RUNNER != '' }}
    runs-on: ${{ inputs.runner || vars.HECATE_LLM_EVAL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Hecate (LLM + Ollama extras)
        run: uv pip install --system -e ".[dev,ollama,litellm]"

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done

      - name: Pull simple-tier model
        env:
          MODEL: ${{ inputs.model || vars.HECATE_LLM_EVAL_MODEL || 'qwen3.6:35b-a3b-q4_K_M' }}
        run: ollama pull "$MODEL"

      - name: Require the reviewed model release policy
        env:
          MODEL: ${{ inputs.model || vars.HECATE_LLM_EVAL_MODEL || 'qwen3.6:35b-a3b-q4_K_M' }}
          FAIL_UNDER: ${{ inputs.fail_under || '0.85' }}
          HECATE_SERVICE_ISOLATED: "1"
          PYTHON_DOTENV_DISABLED: "1"
          HECATE_WORKSPACE: ${{ github.workspace }}/eval-results
          HECATE_OLLAMA_THINK: "false"
          HECATE_OLLAMA_NUM_CTX: "16384"
          HECATE_OLLAMA_TIMEOUT_SEC: "600"
        run: |
          mkdir -p eval-results
          hecate-agent eval-suite --provider ollama --model "$MODEL" \
            --repeats 3 --fail-under "$FAIL_UNDER" \
            --report eval-results/reviewed-policy.json > /dev/null

      - name: Run demotion eval gates
        env:
          CAPABILITY: ${{ github.event.inputs.capability || 'research_synthesize' }}
          FAIL_UNDER: ${{ github.event.inputs.fail_under || '0.85' }}
          HECATE_LLM_SIMPLE_PROVIDER: ollama
          HECATE_LLM_SIMPLE_MODEL: ${{ inputs.model || vars.HECATE_LLM_EVAL_MODEL || 'qwen3.6:35b-a3b-q4_K_M' }}
          HECATE_LLM_SIMPLE_BASE_URL: http://127.0.0.1:11434
          HECATE_LLM_COMPLEX_PROVIDER: ollama
          HECATE_LLM_COMPLEX_MODEL: ${{ inputs.model || vars.HECATE_LLM_EVAL_MODEL || 'qwen3.6:35b-a3b-q4_K_M' }}
          HECATE_LLM_COMPLEX_BASE_URL: http://127.0.0.1:11434
          HECATE_SERVICE_ISOLATED: "1"
          PYTHON_DOTENV_DISABLED: "1"
          HECATE_WORKSPACE: ${{ github.workspace }}/eval-results
          HECATE_OLLAMA_THINK: "false"
          HECATE_OLLAMA_NUM_CTX: "16384"
          HECATE_OLLAMA_TIMEOUT_SEC: "600"
          HECATE_LLM_DEMOTION_GATES: ${{ github.workspace }}/eval-results/llm_demotion_gates.json
        run: |
          mkdir -p eval-results
          # Also allow-list capability names before using them in report filenames.
          case "$CAPABILITY" in
            all|hypothesis|sigma_draft|sigma_review|finding_triage|research_synthesize) ;;
            *) echo "Unsupported capability" >&2; exit 1 ;;
          esac
          if [ "$CAPABILITY" = "all" ]; then
            caps="hypothesis sigma_draft sigma_review finding_triage research_synthesize"
          else
            caps="$CAPABILITY"
          fi
          status=0
          for cap in $caps; do
            echo "::group::eval --write-gate $cap"
            if ! hecate-agent eval --tier simple --write-gate "$cap" --fail-under "$FAIL_UNDER" --output json > "eval-results/$cap.json"; then
              status=1
            fi
            cat "eval-results/$cap.json"
            echo "::endgroup::"
          done
          exit $status

      - name: Upload evaluation reports and any passing stamps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-demotion-gates
          path: |
            eval-results/*.json
            eval-results/*.jsonl
          if-no-files-found: ignore
          retention-days: 30
