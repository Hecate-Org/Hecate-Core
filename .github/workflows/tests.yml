name: Tests

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Must track requires-python in pyproject.toml. Testing a version the
        # package refuses to install on fails at `pip install -e`, not at a
        # test, which is what happened when the floor moved to 3.11.
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"
        
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,similarity]"

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Type check with mypy
      run: |
        mypy hecate_agent --ignore-missing-imports

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=hecate_agent --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      # The action can fail before it uploads (a TLS error fetching its uploader),
      # which fail_ci_if_error does not cover. Coverage reporting must not fail the build.
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  validate-hunts:
    name: Validate Hunt Examples
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set current month for STIX cache key
      id: date
      run: echo "month=$(date +'%Y-%m')" >> $GITHUB_OUTPUT

    - name: Cache STIX Data
      uses: actions/cache@v4
      with:
        path: ~/.hecate/stix-data
        key: stix-data-${{ steps.date.outputs.month }}

    - name: Install Hecate with ATT&CK support
      run: |
        uv pip install --system -e ".[attack]"

    - name: Provision STIX data
      run: |
        hecate-agent attack update

    - name: Validate all hunts
      run: |
        hecate-agent hunt validate

    - name: Check hunt statistics
      run: |
        hecate-agent hunt stats

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[docs]"

    - name: Check packaged documentation synchronization
      run: python scripts/sync_docs.py --check

    - name: Check markdown links
      run: |
        # Install markdown-link-check
        npm install -g markdown-link-check
        # Check all markdown files for broken links
        find . -name "*.md" -not -path "./node_modules/*" -not -path "./.github/*" | xargs markdown-link-check --config .markdown-link-check.json
      continue-on-error: true  # Don't fail on external link issues

    - name: Validate markdown formatting
      run: |
        # Install markdownlint
        npm install -g markdownlint-cli
        # Check markdown style
        markdownlint '**/*.md' --ignore node_modules --ignore .github
      continue-on-error: true  # Don't fail build on style issues

  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        uv pip install --system build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package with twine
      run: |
        twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7
