[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hecate-agent"
dynamic = ["version"]
description = "Hecate - memory and AI for threat hunters"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "BrizoSec"},
    {name = "Sydney Marrone"},
]
maintainers = [
    {name = "BrizoSec"},
]
keywords = [
    "threat-hunting",
    "security",
    "cybersecurity",
    "mitre-attack",
    "detection-engineering",
    "soc",
    "blue-team",
    "incident-response",
    "threat-intelligence",
    "agentic-ai"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "rich>=10.0.0",
    "jinja2>=3.0.0",
    "python-dotenv>=0.19.0",
    "langchain-core>=1.6.5",
    # The orchestrator's artifact extractor fetches report pages. httpx also
    # arrived transitively via mcp, but only in [dev]/[all]; bs4 not at all,
    # so CI's `.[dev]` install failed to import it and pytest aborted.
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
sigma = [
    "pysigma>=1.0.1,<2.0.0",
    "pysigma-backend-kusto>=1.0.0",
    "pysigma-backend-crowdstrike>=3.0.0",
    "pysigma-backend-splunk>=2.1.0",
    "pysigma-backend-elasticsearch>=2.1.0",
    "pysigma-backend-sentinelone>=0.1.3",
]
dev = [
    "pytest>=7.0.0",
    # Exercised by the Sigma validation tests. In [dev] rather than only
    # [sigma] so CI actually runs them -- a validator whose tests silently
    # skip is the same failure it exists to prevent.
    "pysigma>=1.0.1,<2.0.0",
    "pysigma-backend-kusto>=1.0.0",
    "pysigma-backend-crowdstrike>=3.0.0",
    "pysigma-backend-splunk>=2.1.0",
    "pysigma-backend-elasticsearch>=2.1.0",
    "pysigma-backend-sentinelone>=0.1.3",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "flake8-pyproject>=1.2.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "bandit[toml]>=1.7.0",
    "pre-commit>=3.0.0",
    "types-PyYAML>=6.0.0",
    "mcp[cli]>=1.0.0,<2.0.0",
    "scikit-learn>=1.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]
similarity = [
    "scikit-learn>=1.0.0",
]
splunk = [
    "requests>=2.25.0",
]
# LLM providers (choose one or use litellm for all)
litellm = [
    "litellm>=1.30.0",
]
openai = [
    "openai>=1.0.0",
]
anthropic = [
    "anthropic>=0.30.0",
]
bedrock = [
    "boto3>=1.28.0",
]
ollama = [
    "ollama>=0.3.0",
]
attack = [
    "mitreattack-python>=5.0.0",
]
# Web search grounding for hunt-researcher (hecate-agent research new). Previously
# only bundled inside `all`, which also drags in litellm/scikit-learn/mcp --
# a workspace that just wants grounded research (this one) had no way to
# declare that minimally, so a venv rebuild via the documented `pip install
# -e ".[dev,similarity]"` setup would silently lose it and go back to
# research grounding failing open (see hunt_researcher.py's
# _get_search_client(): a missing tavily-python import is caught and
# swallowed, degrading to ungrounded generation with no error surfaced).
research = [
    "tavily-python>=0.3.0",
]
# Convenience: all LLM providers via LiteLLM
llm = [
    "litellm>=1.30.0",
]
# MCP server
mcp = [
    "mcp[cli]>=1.0.0,<2.0.0",  # 2.0.0 removed mcp.server.fastmcp (hecate_agent/mcp/server.py's import path); unverified against it
]
all = [
    "pysigma>=1.0.1,<2.0.0",
    "pysigma-backend-kusto>=1.0.0",
    "pysigma-backend-crowdstrike>=3.0.0",
    "pysigma-backend-splunk>=2.1.0",
    "pysigma-backend-elasticsearch>=2.1.0",
    "pysigma-backend-sentinelone>=0.1.3",
    "litellm>=1.30.0",
    "scikit-learn>=1.0.0",
    "requests>=2.25.0",
    "tavily-python>=0.3.0",
    "mcp[cli]>=1.0.0,<2.0.0",  # 2.0.0 removed mcp.server.fastmcp (hecate_agent/mcp/server.py's import path); unverified against it
    "mitreattack-python>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Hecate-Org/Hecate-Core"
Documentation = "https://github.com/Hecate-Org/Hecate-Core/tree/main/docs"
Repository = "https://github.com/Hecate-Org/Hecate-Core"
Issues = "https://github.com/Hecate-Org/Hecate-Core/issues"

[project.scripts]
hecate-agent = "hecate_agent.cli:main"
hecate-agent-mcp = "hecate_agent.mcp.server:cli"

[tool.setuptools]
packages = [
    "hecate_agent",
    "hecate_agent.agents",
    "hecate_agent.agents.llm",
    "hecate_agent.commands",
    "hecate_agent.core",
    "hecate_agent.data",
    "hecate_agent.mcp",
    "hecate_agent.mcp.tools",
    "hecate_agent.utils",
]

[tool.setuptools.dynamic]
version = {attr = "hecate_agent.__version__.__version__"}

[tool.setuptools.package-data]
"hecate_agent.data" = [
    "templates/*.md",
    "knowledge/*.md",
    "knowledge/**/*.md",
    "prompts/*.md",
    "hunts/*.md",
    "hunts/**/*.md",
    "docs/*.md",
    "docs/**/*.md",
    "integrations/*.md",
    "integrations/**/*.md",
]

[tool.black]
line-length = 127
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 127
target-version = "py311"

[tool.ruff.lint]
# Named explicitly: ruff's default rule set grows between releases (0.16
# reported 2,293 findings here that 0.15 did not), and CI installs the latest.
# These are the errors-and-undefined-names rules the old flake8 gate enforced,
# plus unused imports and variables.
select = ["E4", "E7", "E9", "F"]

[tool.isort]
profile = "black"
line_length = 127
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "hecate_agent.commands",
    "hecate_agent.core.sigma_transpiler",
]
warn_unused_ignores = false

# Ignore missing imports for optional dependencies
[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "tavily",
    "tavily.*",
    "sklearn.*",
    "sigma",
    "sigma.*",
    # Reached through other packages' stubs. numpy 2.5+ (Python 3.12+) ships
    # stubs in 3.12-only syntax, which mypy cannot parse while targeting 3.11.
    "numpy",
    "numpy.*",
    "requests",
    "requests.*",
    "litellm",
    "litellm.*",
    "openai",
    "openai.*",
    "ollama",
    "ollama.*",
    "anthropic",
    "anthropic.*",
    "mitreattack",
    "mitreattack.*",
    "stix2",
    "stix2.*",
    "hecate_agent.core.metrics_tracker",
    "mcp",
    "mcp.*",
]
ignore_missing_imports = true
follow_imports = "skip"
# Without this, "skip" does not apply to packages that ship .pyi stubs.
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --showlocals -ra --strict-markers --cov-report=term-missing --cov-report=html --cov-branch"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, multiple components)",
    "slow: Slow tests (skipped in quick runs)",
    "network: Hits an external service; opt in with -m network",
]

[tool.coverage.run]
source = ["hecate_agent"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.flake8]
max-line-length = 127
max-complexity = 10
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    "dist",
    "build",
    "*.egg-info",
]
ignore = [
    "E203",  # whitespace before ':' (conflicts with black)
    "W503",  # line break before binary operator (conflicts with black)
    "E501",  # line too long (handled by max-line-length)
]
per-file-ignores = [
    "tests/*:D100,D101,D102,D103,D104,D105,D106,D107",
]
select = ["E", "W", "F", "C"]
show-source = true
show-pep8 = true
count = true
statistics = true

[tool.bandit]
exclude_dirs = ["tests", "test_*.py", "*/tests/*"]
skips = ["B101"]  # Skip assert_used check (common in tests)
